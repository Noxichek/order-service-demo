<div style="max-width: 600px; margin: 20px auto;">
  <h2>Просмотр заказа</h2>
  <div>
    <input type="text" [(ngModel)]="orderId" placeholder="Введите Order ID">
    <button (click)="fetchOrder()">Найти</button>
  </div>
  <div *ngIf="error" style="color: red;">{{ error }}</div>
  <div *ngIf="order$$()">
    <h3>Информация о заказе</h3>
    <pre>{{ order$$() | json }}</pre>
  </div>
</div>
